<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="6" ry="6" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="6" ry="6" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Terminal prompt: > symbol -->
  <text
    x="3.5"
    y="14"
    font-family="'Courier New', Courier, monospace"
    font-size="9"
    font-weight="700"
    fill="url(#accent)"
    filter="url(#glow)"
    opacity="0.85"
  >&#x276F;</text>

  <!-- C.M initials -->
  <text
    x="11"
    y="14"
    font-family="'Courier New', Courier, monospace"
    font-size="8.5"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="0.5"
  >CM</text>

  <!-- Separator line -->
  <line x1="3.5" y1="17" x2="28.5" y2="17" stroke="url(#accent)" stroke-width="0.6" opacity="0.4"/>

  <!-- NLP label -->
  <text
    x="16"
    y="24.5"
    font-family="'Courier New', Courier, monospace"
    font-size="5"
    font-weight="400"
    fill="url(#accent)"
    text-anchor="middle"
    letter-spacing="1"
    opacity="0.9"
  >NLP</text>

  <!-- Blinking cursor block -->
  <rect x="25.5" y="20.5" width="3" height="5" rx="0.5" fill="#00e5ff" opacity="0.85" filter="url(#glow)"/>
</svg>
